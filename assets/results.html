<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>측정 결과 목록 - Black Ice Detector</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="results.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>측정 결과 목록</h1>
        </div>

        <div class="results-layout">
            <div class="results-list-card">
                <div class="results-header">
                    <span>측정 리스트</span>
                    <button id="refreshButton" class="secondary-button">새로고침</button>
                </div>
                <div id="resultsList" class="results-list">
                    <div class="results-empty">데이터를 불러오는 중...</div>
                </div>
            </div>

            <div class="results-detail-card">
                <h3>측정 상세</h3>
                <div id="resultsDetail" class="results-detail">
                    리스트에서 항목을 선택하면 상세 결과가 표시됩니다.
                </div>
            </div>
        </div>

        <div id="resultsError" class="error-message" style="display: none;"></div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="results.js"></script>
</body>
</html>
