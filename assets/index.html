<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Ice Detector</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>블랙 아이스(Black Ice) 발생 환경 측정기</h1>
            <img class="arduino-logo" src="img/logo.svg" alt="Arduino Logo" style="display: none;">
        </div>

        <div class="main-content">
            <div class="top-row">
                <div class="distance-card">
                    <div class="distance-label">거리 (Distance)</div>
                    <div class="distance-value" id="distanceValue">---</div>
                    <div class="distance-unit">cm</div>
                    <div class="distance-status" id="distanceStatus">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <span id="statusText">센서 연결 중...</span>
                    </div>
                </div>

                <div class="ldr-card">
                    <div class="ldr-label">조도 센서 (LDR)</div>
                    <div class="ldr-value" id="ldrValue">---</div>
                    <div class="ldr-unit">0~1023</div>
                </div>

                <div class="result-card">
                    <h3>측정 결과 (<span id="measurementDurationLabel">60</span>초 평균)</h3>
                    <div class="result-item">
                        <span class="result-label">거리</span>
                        <span class="result-value" id="avgDistance">---</span>
                        <span class="result-unit">cm</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">조도</span>
                        <span class="result-value" id="avgLdr">---</span>
                        <span class="result-unit">0~1023</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">온도</span>
                        <span class="result-value" id="avgTemp">---</span>
                        <span class="result-unit">°C</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">습도</span>
                        <span class="result-value" id="avgHumidity">---</span>
                        <span class="result-unit">%</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">위치</span>
                        <span class="result-value" id="avgLocation">---</span>
                        <span class="result-unit"></span>
                    </div>
                </div>
            </div>

            <div class="second-row">
                <div class="input-card">
                    <h3>수동 입력</h3>
                    <div class="input-row">
                        <label class="input-label" for="temperatureInput">온도 (°C)</label>
                        <input id="temperatureInput" class="input-field" type="number" step="0.1" placeholder="예: 3.5">
                    </div>
                    <div class="input-row">
                        <label class="input-label" for="humidityInput">습도 (%)</label>
                        <input id="humidityInput" class="input-field" type="number" step="0.1" placeholder="예: 65">
                    </div>
                    <div class="input-row">
                        <label class="input-label" for="locationInput">위치 번호</label>
                        <input id="locationInput" class="input-field" type="number" step="1" placeholder="예: 101">
                    </div>
                    <button id="measureButton" class="primary-button">측정</button>
                    <div class="measurement-status" id="measurementStatus">대기 중</div>
                </div>

                <div class="camera-card">
                    <div class="camera-label">카메라</div>
                    <div class="camera-frame">
                        <video id="cameraFeed" autoplay playsinline muted></video>
                    </div>
                </div>
            </div>

            <div class="info-card">
                <h3>센서 정보</h3>
                <div class="info-item">
                    <span class="info-label">센서 모델:</span>
                    <span class="info-value">HC-SR04</span>
                </div>
                <div class="info-item">
                    <span class="info-label">측정 범위:</span>
                    <span class="info-value">2cm ~ 400cm</span>
                </div>
                <div class="info-item">
                    <span class="info-label">업데이트 주기:</span>
                    <span class="info-value">100ms (10회/초)</span>
                </div>
            </div>
        </div>

        <div id="errorContainer" class="error-message" style="display: none;"></div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
